<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Aris</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23c9a15a' d='M12 1l8 3.5v6c0 5.2-3.4 9.9-8 11.5-4.6-1.6-8-6.3-8-11.5v-6L12 1z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<style>
  .notfound {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
    position: relative;
    z-index: 2;
  }
  .notfound .eyebrow { justify-content: center; }
  .notfound h1 {
    font-size: clamp(2.2rem, 6vw, 3.2rem);
    font-weight: 500;
    margin: 0 0 1rem;
  }
  .notfound p {
    color: var(--ink-dim);
    max-width: 28rem;
    margin: 0 0 2rem;
  }
</style>
</head>
<body>

<div class="top-accent" aria-hidden="true"><div class="top-accent-fill" id="scroll-progress" style="width:100%"></div></div>
<canvas id="net-bg" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>

<div class="notfound">
  <p class="eyebrow">404</p>
  <h1>This page hasn't been logged yet.</h1>
  <p>Whatever you were looking for isn't here — maybe it moved, or maybe it's still on the roadmap.</p>
  <a href="/" class="btn btn-primary">Back to the log</a>
</div>

<script>
  // Lightweight standalone version of the background animation (no theme toggle needed here)
  (() => {
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const canvas = document.getElementById('net-bg');
    const ctx = canvas.getContext('2d');
    let nodes = [], w, h, dpr;
    function sizeCanvas() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth; h = window.innerHeight;
      canvas.width = w * dpr; canvas.height = h * dpr;
      canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function initNodes() {
      const count = Math.min(46, Math.floor((w * h) / 34000));
      nodes = Array.from({ length: count }, () => ({
        x: Math.random() * w, y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.16, vy: (Math.random() - 0.5) * 0.16,
      }));
    }
    function draw() {
      ctx.clearRect(0, 0, w, h);
      for (let i = 0; i < nodes.length; i++) {
        const a = nodes[i];
        for (let j = i + 1; j < nodes.length; j++) {
          const b = nodes[j];
          const dist = Math.hypot(a.x - b.x, a.y - b.y);
          if (dist < 140) {
            ctx.strokeStyle = `rgba(154,162,176,${(1 - dist/140) * 0.08})`;
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
          }
        }
      }
      for (const n of nodes) {
        ctx.beginPath(); ctx.arc(n.x, n.y, 1.3, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(201,161,90,0.35)'; ctx.fill();
      }
    }
    function tick() {
      for (const n of nodes) {
        n.x += n.vx; n.y += n.vy;
        if (n.x < 0 || n.x > w) n.vx *= -1;
        if (n.y < 0 || n.y > h) n.vy *= -1;
      }
      draw();
      if (!reduceMotion) requestAnimationFrame(tick);
    }
    sizeCanvas(); initNodes(); draw();
    if (!reduceMotion) requestAnimationFrame(tick);
    window.addEventListener('resize', () => { sizeCanvas(); initNodes(); draw(); });

    const stored = localStorage.getItem('theme');
    if (stored) document.documentElement.setAttribute('data-theme', stored);
  })();
</script>
</body>
</html>
